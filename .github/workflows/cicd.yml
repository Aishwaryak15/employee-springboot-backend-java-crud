# CI/CD Workflow for Spring Boot Employee Management Application
name: CI/CD Pipeline

# Trigger the workflow on push to main branch and on pull requests
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Environment variables
env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx3072m'

# Permissions for the workflow
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Build and Test Job
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    # Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # Set up JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'maven'

    # Make Maven wrapper executable (if not already)
    - name: Make Maven wrapper executable
      run: chmod +x ./mvnw
      continue-on-error: true

    # Validate Maven project
    - name: Validate Maven project
      run: ./mvnw validate

    # Compile the project
    - name: Compile project
      run: ./mvnw clean compile

    # Run unit tests
    - name: Run tests
      run: ./mvnw test

    # Generate code coverage report using Jacoco
    - name: Generate code coverage report
      run: ./mvnw jacoco:report

    # Upload code coverage report as an artifact
    - name: Upload code coverage report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: target/site/jacoco/
        retention-days: 30

    # Package the application
    - name: Package application
      run: ./mvnw package -DskipTests

    # Upload the built JAR as an artifact
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: springboot-backend-jar
        path: target/*.jar
        retention-days: 30

  # Docker Build Job (optional, can be enabled when needed)
  docker-build:
    name: Build Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    # Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # Download the JAR artifact from build job
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: springboot-backend-jar
        path: target/

    # Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build Docker image
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: ${{ github.event.repository.name }}:${{ github.sha }},${{ github.event.repository.name }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Optional: Login to Docker Hub (uncomment and configure secrets)
    # - name: Login to Docker Hub
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ secrets.DOCKER_USERNAME }}
    #     password: ${{ secrets.DOCKER_PASSWORD }}

    # Optional: Push to Docker Hub (uncomment after configuring login and DOCKER_USERNAME secret)
    # - name: Push Docker image
    #   uses: docker/build-push-action@v5
    #   with:
    #     context: .
    #     push: true
    #     tags: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest

